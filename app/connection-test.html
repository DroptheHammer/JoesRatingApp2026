<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>All the Joes — Connection Test</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f4ecdc; color: #2a2522; margin: 0; padding: 20px; max-width: 520px; }
  h1 { color: #b3202a; font-size: 22px; }
  input, select, button, textarea { font: inherit; width: 100%; padding: 10px; margin: 4px 0 12px; border: 1.5px solid #cbb994; border-radius: 6px; box-sizing: border-box; background: #fff8ec; }
  button { background: #b3202a; color: #fff; border: 0; font-weight: 700; cursor: pointer; }
  pre { background: #fff8ec; border: 1px solid #cbb994; padding: 10px; white-space: pre-wrap; font-size: 12px; max-height: 320px; overflow: auto; }
  .ok { color: #2f5d3a; } .err { color: #b3202a; }
</style>
</head>
<body>
<h1>All the Joes · Connection test</h1>
<p>Use this after deploying the Apps Script to check that the app can reach your Google Sheet.</p>

<label>Family passcode</label>
<input id="pass" type="password" autocomplete="off">
<button id="save">Save passcode &amp; load data</button>

<h3>Send a test rating</h3>
<label>Your name</label><input id="person" value="Test">
<button id="rate">Submit test rating (North Beach)</button>

<h3>Send a test photo</h3>
<input id="photo" type="file" accept="image/*">
<button id="send">Upload photo</button>

<div id="status"></div>
<pre id="out"></pre>

<script type="module">
import { SCRIPT_URL, getPasscode, setPasscode, loadData, submitRating, submitPhoto } from './api.js';
const $ = id => document.getElementById(id);
const show = (msg, ok, data) => {
  $('status').innerHTML = `<b class="${ok ? 'ok' : 'err'}">${msg}</b>`;
  $('out').textContent = data ? JSON.stringify(data, null, 2) : '';
};
const run = async (label, fn) => {
  if (SCRIPT_URL.startsWith('PASTE')) return show('Paste your Web app URL into app/api.js first.', false);
  show(label + '…', true);
  try { show(label + ' ✓', true, await fn()); } catch (e) { show(label + ' failed: ' + e.message, false); }
};
$('pass').value = getPasscode();
const visit = () => ({ visit_id: 'test-' + new Date().toISOString().slice(0, 10), location_id: 'north-beach', visit_date: new Date().toISOString().slice(0, 10), person: $('person').value });
$('save').onclick = () => { setPasscode($('pass').value); run('Load data', loadData); };
$('rate').onclick = () => run('Submit rating', () => submitRating({ ...visit(), decor: 8, service: 8, bath: 7, food: 9, xmas: null, comment: 'Connection test' }));
$('send').onclick = () => { const f = $('photo').files[0]; if (f) run('Upload photo', () => submitPhoto(f, { ...visit(), caption: 'Test photo' })); };
</script>
</body>
</html>
